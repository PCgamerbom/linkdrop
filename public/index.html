<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkDrop - Conversor de Mídia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎬 LinkDrop</h1>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/privacy.html">Privacidade</a></li>
                <li><a href="/terms.html">Termos</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h2>Download de Vídeos e Áudio</h2>
            <p>Converta vídeos para MP4, MP3 ou WAV gratuitamente</p>
        </section>

        <section class="converter">
            <div class="form-group">
                <label for="url">Cole o link do vídeo:</label>
                <input 
                    type="url" 
                    id="url" 
                    placeholder="https://exemplo.com/video"
                    required
                >
                <button id="verifyBtn" class="btn-primary">Verificar Link</button>
            </div>

            <div id="videoInfo" class="video-info" style="display: none;">
                <img id="thumbnail" src="" alt="Thumbnail">
                <div>
                    <h3 id="videoTitle"></h3>
                    <p id="videoDuration"></p>
                </div>
            </div>

            <div id="options" style="display: none;">
                <div class="form-group">
                    <label for="format">Formato:</label>
                    <select id="format">
                        <option value="mp4">MP4 (Vídeo)</option>
                        <option value="mp3">MP3 (Áudio)</option>
                        <option value="wav">WAV (Áudio)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quality">Qualidade:</label>
                    <select id="quality">
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                        <option value="360p">360p</option>
                        <option value="128kbps">128kbps</option>
                        <option value="320kbps">320kbps</option>
                    </select>
                </div>

                <button id="downloadBtn" class="btn-success">⬇️ Baixar Agora</button>
            </div>

            <div id="progress" class="progress" style="display: none;">
                <div class="progress-bar"></div>
                <p id="progressText">0%</p>
            </div>

            <div id="message" class="message"></div>
        </section>

        <section class="features">
            <div class="feature">
                <span>✅</span>
                <h3>Interface Simples</h3>
                <p>Fácil de usar</p>
            </div>
            <div class="feature">
                <span>✅</span>
                <h3>Múltiplos Formatos</h3>
                <p>MP4, MP3, WAV</p>
            </div>
            <div class="feature">
                <span>✅</span>
                <h3>100% Gratuito</h3>
                <p>Sem custos</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 LinkDrop. Desenvolvido com ❤️ por <a href="https://github.com/PCgamerbom">PCgamerbom</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
